# Ruleset WOOD FRAME - versão de desenvolvimento.
# TODOS os valores são de REFERÊNCIA para teste do software.
# approval.approved_by = null  => toda execução sai marcada como RASCUNHO.
ruleset: wood-br-v1.0-dev
system: wood
units: mm
approval: {approved_by: null, registro: null, date: null}

# Tipos de parede (Anexo A3). Escolha por atributo quando a parede não traz wall_type.
wall_types:
  PE-01: {name: "Externa portante", stud: W-38x140, spacing: 400, sheathing: OSB-11.1-1200x2400, sheathing_side: exterior, finish_board: GESSO-ST-12.5-1200x2400}
  PE-02: {name: "Externa não portante", stud: W-38x140, spacing: 600, sheathing: OSB-11.1-1200x2400, sheathing_side: exterior, finish_board: GESSO-ST-12.5-1200x2400}
  PI-01: {name: "Interna portante", stud: W-38x89, spacing: 400, sheathing: null, finish_board: GESSO-ST-12.5-1200x2400}
  PI-02: {name: "Divisória", stud: W-38x89, spacing: 600, sheathing: null, finish_board: GESSO-ST-12.5-1200x2400}
auto_wall_type: {exterior_bearing: PE-01, exterior_nonbearing: PE-02, interior_bearing: PI-01, interior_nonbearing: PI-02}

plates: {bottom: 1, top: 2, cap_lap_min: 600, cap_from_site: true}
stud_clearance: 0            # folga de montagem no comprimento do montante
spacing_tolerance: 0         # tolerância sobre o espaçamento máximo (mm)

panels:
  max_length: 7200
  min_length: 600
  min_joint_to_opening: 150  # além da zona king+jack
  max_weight_kg: 350

openings:
  clearance_per_side: 10
  clearance_top: 10
  header_table: tables/headers_wood.csv
  min_cripple_length: 60
  min_distance_to_corner: 100
  min_distance_between: 76

corners: {corner_style: two_stud_backer, t_junction_style: double_stud_ladder}

blocking:
  fixed_rows: [1200, 2400]     # linhas de bloqueio padronizadas (mm do piso do painel); 2400 = junta da placa
  spacing_vertical: 1200
  when_no_structural_sheathing: true
  at_sheathing_joints: true

sheathing:
  orientation: vertical
  fastening: {edge_pitch: 150, field_pitch: 300, fastener: PREGO-ANEL-2.9x50}
  edge_support_required: true

bracing:
  method: segmented
  min_segment_length: 600
  min_effective_length: {default: 3000}   # por eixo e por pavimento (mm)
  hold_down: {item: HOLDDOWN-HD1, at: segment_ends}

anchorage:
  base: {item: CHUMBADOR-M12, max_from_plate_end: 300, pitch: 1200}
  roof_uplift: {item: CONECTOR-ARRANC-H1, per_bearing: 1}

# Ligações: tipo -> fixador e quantidade (Anexo A10). Valores de referência.
connections:
  LG-01: {name: "montante-placa inferior", fastener: PREGO-ANEL-3.3x90, qty: 2}
  LG-02: {name: "montante-placa superior", fastener: PREGO-ANEL-3.3x90, qty: 2}
  LG-03: {name: "placa sup - placa sup (capa)", fastener: PREGO-ANEL-3.3x90, qty_per_m: 4}
  LG-04: {name: "montante-montante", fastener: PREGO-ANEL-3.3x90, qty_per_m: 5}
  LG-05: {name: "verga-apoio", fastener: PREGO-ANEL-3.3x90, qty: 4}
  LG-06: {name: "painel-painel", fastener: PREGO-ANEL-3.3x90, qty_per_m: 3}
  LG-07: {name: "painel-base", fastener: CHUMBADOR-M12, qty: 0}
  LG-15: {name: "bloqueio-montante", fastener: PREGO-ANEL-3.3x90, qty: 2}
  LG-16: {name: "peitoril/cripple", fastener: PREGO-ANEL-3.3x90, qty: 2}

  LG-09: {name: "viga de piso - borda/cabeceira", fastener: PREGO-ANEL-3.3x90, qty: 4}
  LG-11: {name: "nó de treliça", fastener: CHAPA-DENTADA-CD1, qty: 2}

floors:
  joist: W-38x235
  rim: W-38x235
  spacing: 400
  max_span: 3900             # vão livre máximo da viga W-38x235 a cada 400 (REFERÊNCIA)
  bridging_spacing: 2100
  subfloor: OSB-18.3-1200x2400
  subfloor_waste: 0.08
  hole_trimmer_plies: 2
  hole_header_plies: 2

roof:
  spacing: 600
  heel_height: 0
  overhang: 500
  batten_spacing: 350
  bottom_chord_restraint_max: 2400
  truss_table:
    - {type: kingpost, span_min: 0,    span_max: 5000,  top: W-38x140, bottom: W-38x89, web: W-38x89}
    - {type: fink,     span_min: 5000, span_max: 10000, top: W-38x140, bottom: W-38x140, web: W-38x89}
    - {type: howe,     span_min: 10000, span_max: 13000, top: W-38x184, bottom: W-38x140, web: W-38x89}
  mono: {top: W-38x140, bottom: W-38x89, web: W-38x89, span_max: 7000}
  gable: {top: W-38x140, bottom: W-38x89, web: W-38x89}
  plate: CHAPA-DENTADA-CD1
  batten: W-38x89
  restraint: W-38x89

curved_wall: {min_radius: 1500, max_chord: 1200, max_sagitta: 25, min_chord: 200, facet_joint_style: double_stud}

columns: {load_factor_kPa: 3.5}

manufacturing:
  kerf: 3
  offcut_min_reusable: 400
  tolerances: {length: 1, squareness_deg: 0.5, stud_position: 2, diagonal_diff: 3}

# Rastro de norma (A10.7). basis.approved_by = null => regra não aprovada.
basis:
  wall_types.PE-01.spacing: {type: tabela_do_engenheiro, ref: "PREENCHER", approved_by: null}
  openings.header_table:    {type: tabela_do_engenheiro, ref: "PREENCHER", approved_by: null}
  bracing.min_effective_length: {type: decisao_do_engenheiro, ref: "PREENCHER", approved_by: null}
  floors.max_span:          {type: tabela_do_engenheiro, ref: "PREENCHER", approved_by: null}
  roof.truss_table:         {type: tabela_do_engenheiro, ref: "PREENCHER", approved_by: null}
